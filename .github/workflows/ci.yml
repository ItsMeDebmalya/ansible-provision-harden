---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ansible-lint ansible-core
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: molecule (ubuntu2204 + rockylinux9)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Molecule
        run: pip install "molecule-plugins[docker]" molecule ansible-core
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Run Molecule (converge + idempotence + verify on both distros)
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
