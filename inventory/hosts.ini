# Inventory for ansible-provision-harden
#
# Replace the host entries below with your target servers. The single
# `site.yml` run brings each host from a fresh install to a CIS-baselined,
# production-ready state.
#
# Example (SSH key auth assumed; see ansible.cfg):
#
#   [webservers]
#   web01 ansible_host=10.0.0.11
#   web02 ansible_host=10.0.0.12
#
#   [dbservers]
#   db01  ansible_host=10.0.0.21

[linux_servers]
# host01 ansible_host=192.0.2.10 ansible_user=ubuntu

[linux_servers:vars]
ansible_user=ansible
